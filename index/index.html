<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailPoint</title> 
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>  
        <div class="container header-content">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5v-7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2z"/><path d="M6.5 15.5h11"/><path d="M8 15.5v3.5"/><path d="M16 15.5v3.5"/><path d="M8 11.5h8"/></svg>
                <h1>RailPoint</h1>
            </div>
            <div class="header-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="search-bar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="trainSearch" placeholder="Search by train name, source, or destination..." onkeyup="handleSearch()">
        </div>

        <nav class="tabs">
            <button class="tab active" data-tab="schedule">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Schedule
            </button>
            <button class="tab" data-tab="stations">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                Stations
            </button>
            <button class="tab" data-tab="bookings">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                Bookings
            </button>
            <button class="tab" data-tab="Coach-Status">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                Coach-Status
            </button>

            <!-- Burger Menu Button -->
            <button class="burger-menu" onclick="toggleMenu()">☰</button>

            <!-- Sidebar Menu -->
            <div id="sidebarMenu" class="sidebar">
                <button class="close-btn" onclick="toggleMenu()">✖</button>
                <ul>
                    <li onclick="showBookings()">My Bookings</li>
                    <li onclick="showTrainStatus()">Train Running Status</li>
                    <li id="loginSignupMenuItem" onclick="showLoginSignup()">Login / Signup</li>
                    <li id="logoutMenuItem" style="display: none;" onclick="logoutUser()">Log Out</li>
                </ul>
            </div>

            <!-- Content Sections -->
            <div id="bookingsSection" class="hidden-section"></div>
            <div id="trainStatusSection" class="hidden-section"></div>
            <div id="loginSignupSection" class="hidden-section"></div>

        </nav>

        <main>
            <div id="schedule" class="tab-content active"></div>
            <div id="stations" class="tab-content"></div>
            <div id="bookings" class="tab-content">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <h3>No Active Bookings</h3>
                    <p>Your booking history will appear here</p>
                    <button class="btn-primary">Make a Booking</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
