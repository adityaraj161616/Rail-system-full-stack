<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>
    <link rel="stylesheet" href="loginstyle.css"> <!-- Link your CSS file here -->
</head>
<body>
    <div class="container">
        <h2>Login / Signup</h2>
        <div id="auth-tabs">
            <button onclick="showLogin()">Login</button>
            <button onclick="showSignup()">Sign Up</button>
        </div>
        
        <div id="login-form" style="display: none;">
            <h3>Login</h3>
            <input type="text" id="login-username" placeholder="Enter Username">
            <input type="password" id="login-password" placeholder="Enter Password">
            <button onclick="login()">Login</button>
        </div>

        <div id="signup-form" style="display: none;">
            <h3>Sign Up</h3>
            <input type="text" id="signup-username" placeholder="Enter Username">
            <input type="password" id="signup-password" placeholder="Enter Password">
            <button onclick="signup()">Sign Up</button>
        </div>
    </div>

    <script>
        // Toggle between Login and Signup forms
        function showLogin() {
            document.getElementById("login-form").style.display = "block";
            document.getElementById("signup-form").style.display = "none";
        }

        function showSignup() {
            document.getElementById("signup-form").style.display = "block";
            document.getElementById("login-form").style.display = "none";
        }

        // Login Function
        function login() {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;
            
            if (!username || !password) {
                alert("Please enter valid credentials!");
                return;
            }

            alert(`Welcome, ${username}! You are now logged in.`);
            window.location.href = 'index.html'; // Redirect back to the home page
        }

        // Signup Function
        function signup() {
            const username = document.getElementById("signup-username").value;
            const password = document.getElementById("signup-password").value;
            
            if (!username || !password) {
                alert("Please enter valid information!");
                return;
            }

            alert("Account created successfully!");
            window.location.href = 'index.html'; // Redirect back to the home page
        }

        // Show Login by default when the page loads
        showLogin();
    </script>
</body>
</html>
